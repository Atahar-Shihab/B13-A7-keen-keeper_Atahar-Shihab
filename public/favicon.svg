<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="kkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#kkBg)" filter="url(#softGlow)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" fill="none" />

  <!-- Orbital Cadence Arc -->
  <path d="M 40 14 C 54 20, 58 38, 48 50" fill="none" stroke="#6EE7B7" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 3.5" stroke-opacity="0.8" />

  <!-- Geometric 'K' Mark -->
  <!-- Vertical Pillar -->
  <rect x="16" y="15" width="8" height="34" rx="4" fill="url(#kkGlow)" />

  <!-- Upper Arm -->
  <path d="M 23 31 L 38.5 15.5 C 40 14 42.5 14 44 15.5 C 45.5 17 45.5 19.5 44 21 L 29 36 Z" fill="url(#kkGlow)" />

  <!-- Lower Arm -->
  <path d="M 27 33 L 42 48 C 43.5 49.5 43.5 52 42 53.5 C 40.5 55 38 55 36.5 53.5 L 22 39 Z" fill="url(#kkGlow)" />

  <!-- Active Relationship Pulse Node -->
  <circle cx="46" cy="32" r="5" fill="#10B981" />
  <circle cx="46" cy="32" r="2.2" fill="#FFFFFF" />
</svg>